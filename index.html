<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Landing Page</title>

    <!-- Tailwind CDN -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->

    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Manrope Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- font awesome CDN -->
    <script src="https://kit.fontawesome.com/f16c9d2d48.js" crossorigin="anonymous"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        .font-manrope {
            font-family: "Manrope", sans-serif;
        }
    </style>

</head>

<body class="font-manrope">
    <!-- Header Section -->
    <header class="bg-gradient-to-r from-[#FFFFFF] to-[#FFFFFF]">
        <!-- Nav Bar -->
        <nav class="md:container mx-auto p-5 md:px-16 md:py-8">
            <div class="navbar bg-base-100 ">
                <div class="navbar-start">
                    <div class=" dropdown">
                        <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                            <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h8m-8 6h16" />
                            </svg>
                        </div>
                        <ul tabindex="-1"
                            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                            <li><a>Home</a></li>
                            <li><a>Services</a></li>
                            <li><a>Portfolio</a></li>
                            <li><a>Blogs</a></li>
                            <li><a>Contact Us</a></li>
                        </ul>
                    </div>
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-arrow-right-long bg-[#ABEF5F] rounded-full p-3 -rotate-45"></i>
                        <a class="font-extrabold text-4xl">Rinterio</a>
                    </div>
                </div>
                <div class="navbar-center hidden lg:flex">
                    <ul class="menu menu-horizontal px-1">
                        <li><a>Home</a></li>
                        <li><a>Services</a></li>
                        <li><a>Portfolio</a></li>
                        <li><a>Blogs</a></li>
                        <li><a>Contact Us</a></li>
                    </ul>
                </div>
                <div class="navbar-end hidden md:flex items-center gap-2">
                    <!-- icon -->
                    <div>
                        <i class="fa-solid fa-magnifying-glass text-2xl bg-white"></i>
                        <i class="fa-solid fa-cart-shopping text-2xl"></i>
                    </div>
                    <div class="btn bg-[#ABEF5F] rounded-4xl px-5 py-3 ">
                        <a class="font-extrabold text-lg">Book Consult</a>
                        <i class="fa-solid fa-arrow-right-long bg-black text-white rounded-full -rotate-45 p-1"></i>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Banner -->
        <div class="md:container mx-auto p-5 md:px-16 md:py-8">
            <!-- image -->
             <div class="flex justify-center items-center">
                <img src="assets/banner.png" alt="">
             </div>
        </div>
    </header>

    <!-- Main Section -->
    <main></main>

    <!-- footer -->
    <footer></footer>
</body>

</html>
